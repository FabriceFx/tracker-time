<script>
  const App = (() => {
    let heureDebut = null;
    let intervalleChrono = null;
    let estEnCours = false;
    let estEnPause = false;
    let tempsEcouleEnPause = 0;
    let sauvegardeEnCours = false;
    let initialise = false;
    let donneesCompletes = [];
    let baseH = 8;
    
    // Récupération de la locale injectée par le serveur (défaut : 'en')
    let lang = '<?!= locale ?>'.toLowerCase().startsWith('fr') ? 'fr' : 'en';

    const STORAGE_KEY = 'timetracker_state';
    const CIRCUMFERENCE = 2 * Math.PI * 40;

    const TAB_GROUPS = {
      mode: ['chrono', 'manual'],
      period: ['aujourdhui', 'week']
    };

    const I18N = {
      fr: {
        projectTask: 'Projet & tâche',
        projet: 'Projet',
        tache: 'Tâche',
        loading: 'Chargement...',
        chooseProjectFirst: "Choisir un projet d'abord",
        selectProject: '-- Sélectionner le projet --',
        selectTask: '-- Sélectionner la tâche --',
        tabChrono: 'Chrono',
        tabManual: 'Saisie',
        start: 'Lancer',
        stop: 'Arrêter',
        ready: 'Prêt',
        recording: 'Enregistrement...',
        timing: 'Chronométrage en cours...',
        estEnPause: 'En pause',
        pausedRestored: 'En pause, restauré',
        saveFailed: 'Erreur d\'enregistrement. Durée conservée, réessayez avec Arrêter.',
        heuresDuree: 'Durée en heures',
        save: 'Enregistrer',
        dailyProgress: 'Progression du jour',
        aujourdhui: "Aujourd'hui",
        week: 'Semaine',
        noEntries: "Aucune saisie aujourd'hui",
        loadingData: 'Chargement...',
        error: 'Erreur',
        noData: 'Pas de données',
        kbStartStop: 'Lancer/Arrêter',
        pause: 'Pause',
        selectBoth: 'Sélectionnez un projet et une tâche.',
        selectBothShort: 'Sélectionnez projet et tâche.',
        invalidDuration: 'Durée invalide.',
        min: 'min',
        totalWeek: 'Total',
        errorLoading: 'Erreur de chargement des données',
        jours: 'j',
        developedBy: 'Développé par',
        saved: 'Enregistré !',
        refreshing: 'Actualisation...',
        refreshed: 'Listes mises à jour !',
        helpTitle: 'Guide d\'utilisation',
        helpPrev: 'Préc.',
        helpNext: 'Suivant',
        helpClose: 'Terminer',
        helpStep1Title: '1. Configurer vos projets',
        helpStep1: 'Dans Google Sheets, ouvrez l\'onglet <strong>Config</strong>. Ajoutez une ligne par tâche : <strong>Projet</strong> en colonne A, <strong>Tâche</strong> en colonne B. Cliquez ensuite sur ↻ dans la sidebar pour les charger.',
        helpStep2Title: '2. Sélectionner le projet et la tâche',
        helpStep2: 'Choisissez d\'abord un <strong>projet</strong> dans la première liste, puis une <strong>tâche</strong> dans la deuxième. Ces deux champs sont obligatoires avant toute saisie.',
        helpStep3Title: '3. Enregistrer votre temps',
        helpStep3Chrono: '<strong>Chronomètre</strong> : Cliquez sur Lancer pour démarrer, sur Arrêter pour stopper et enregistrer. Utilisez Pause pour interrompre sans perdre le temps.',
        helpStep3Manual: '<strong>Saisie manuelle</strong> : Entrez directement la durée en heures (ex : 1.5 = 1h30). Les boutons +/− ajustent par paliers de 15 min. Une valeur négative soustrait du temps.',
        helpStep4Title: '4. Suivi et rapports',
        helpStep4: 'La jauge indique votre progression du jour. L\'onglet <strong>Aujourd\'hui</strong> liste vos saisies. L\'onglet <strong>Semaine</strong> affiche le bilan hebdomadaire. Un e-mail récapitulatif est envoyé automatiquement quand vous atteignez votre quota.'
      },
      en: {
        projectTask: 'Project & Task',
        projet: 'Project',
        tache: 'Task',
        loading: 'Loading...',
        chooseProjectFirst: 'Choose a project first',
        selectProject: '-- Select project --',
        selectTask: '-- Select task --',
        tabChrono: 'Timer',
        tabManual: 'Manual',
        start: 'START',
        stop: 'STOP',
        ready: 'Ready',
        recording: 'Saving...',
        timing: 'Timing in progress...',
        estEnPause: 'Paused',
        pausedRestored: 'Paused, restored',
        saveFailed: 'Save failed. Duration kept, try STOP again.',
        heuresDuree: 'Duration in hours',
        save: 'Save',
        dailyProgress: 'Daily progress',
        aujourdhui: 'Today',
        week: 'Week',
        noEntries: 'No entries today',
        loadingData: 'Loading...',
        error: 'Error',
        noData: 'No data',
        kbStartStop: 'Start/Stop',
        pause: 'Pause',
        selectBoth: 'Please select a project AND a task.',
        selectBothShort: 'Select project and task.',
        invalidDuration: 'Invalid duration.',
        min: 'min',
        totalWeek: 'Total',
        errorLoading: 'Error loading data',
        jours: 'd',
        developedBy: 'Developed by',
        saved: 'Saved!',
        refreshing: 'Refreshing...',
        refreshed: 'Lists updated!',
        helpTitle: 'User Guide',
        helpPrev: 'Back',
        helpNext: 'Next',
        helpClose: 'Done',
        helpStep1Title: '1. Set up your projects',
        helpStep1: 'In Google Sheets, open the <strong>Config</strong> tab. Add one row per task: <strong>Project</strong> in column A, <strong>Task</strong> in column B. Then click ↻ in the sidebar to reload.',
        helpStep2Title: '2. Select project & task',
        helpStep2: 'First choose a <strong>project</strong> from the first dropdown, then a <strong>task</strong> from the second. Both fields are required before any entry.',
        helpStep3Title: '3. Log your time',
        helpStep3Chrono: '<strong>Stopwatch</strong>: Click START to begin, STOP to save. Use PAUSE to pause without losing time.',
        helpStep3Manual: '<strong>Manual entry</strong>: Type a duration in hours (e.g. 1.5 = 1h30). The +/− buttons adjust by 15-min steps. A negative value subtracts time.',
        helpStep4Title: '4. Tracking & reports',
        helpStep4: 'The gauge shows your daily progress. The <strong>Today</strong> tab lists your entries. The <strong>Week</strong> tab shows the weekly summary. A recap email is sent automatically when you reach your quota.'
      }
    };

    function t(key) {
      return (I18N[lang] || I18N.fr)[key] || key;
    }

    function byId(id) {
      return document.getElementById(id);
    }

    function applyI18n() {
      document.querySelectorAll('[data-i18n]').forEach(el => {
        el.innerHTML = t(el.dataset.i18n);
      });
    }

    function showLoading(textKey) {
      const overlay = byId('loadingOverlay');
      const overlayText = byId('loadingOverlayText');
      if (overlay && overlayText) {
        overlayText.textContent = t(textKey);
        overlay.classList.add('show');
      }
    }

    function hideLoading() {
      const overlay = byId('loadingOverlay');
      if (overlay) {
        overlay.classList.remove('show');
      }
    }

    function init() {
      const savedLang = localStorage.getItem('timetracker_lang');
      if (savedLang) {
        lang = savedLang;
      }
      
      applyI18n();
      bindEvents();

      showLoading('loadingData');

      google.script.run
        .withSuccessHandler(resultat => {
          hideLoading();
          
          if (resultat && resultat.locale && !savedLang) {
            lang = resultat.locale;
          }

          byId('lang-fr').classList.toggle('active', lang === 'fr');
          byId('lang-en').classList.toggle('active', lang === 'en');

          applyI18n();

          donneesCompletes = resultat && resultat.projectsAndTasks ? resultat.projectsAndTasks : [];
          renderProjects(donneesCompletes);

          if (resultat && resultat.aujourdhui) {
            renderToday(resultat.aujourdhui);
          } else {
            renderToday({ saisies: [], totalHeures: 0, heuresDeBase: 8 });
          }

          restoreState();
          setInitialized(true);
        })
        .withFailureHandler(erreur => {
          hideLoading();
          setInitialized(true);
          afficherNotification(t('errorLoading') + formaterMessageErreur(erreur), 'error');
          byId('status').textContent = t('error');
        })
        .obtenirDonneesInitialesBarreLaterale();
    }

    function bindEvents() {
      byId('projectSelect').addEventListener('change', () => {
        updateTaskDropdown();
        persistSelectionIfNeeded();
      });

      byId('taskSelect').addEventListener('change', persistSelectionIfNeeded);
    }

    function setInitialized(valeur) {
      initialise = valeur;
      byId('loadingLine').classList.toggle('hidden', valeur);
      byId('projectSelect').disabled = !valeur;
      byId('taskSelect').disabled = !valeur || !byId('projectSelect').value;
      byId('manualHours').disabled = !valeur;
      setSavingState(false);

      if (valeur && !estEnCours) {
        byId('status').textContent = t('ready');
      }
    }

    function renderProjects(donnees) {
      const projectSelect = byId('projectSelect');
      const previousProject = projectSelect.value;
      const previousTask = byId('taskSelect').value;

      projectSelect.innerHTML = '';
      addOption(projectSelect, '', t('selectProject'));

      const projects = [...new Set((donnees || []).map(ligne => ligne[0]).filter(Boolean))];
      projects.forEach(projet => addOption(projectSelect, projet, projet));

      // Restaurer la sélection précédente ou celle sauvegardée
      const saved = chargerEtat();
      const targetProject = previousProject || (saved && saved.projet) || '';
      if (targetProject) projectSelect.value = targetProject;

      updateTaskDropdown();

      const targetTask = previousTask || (saved && saved.tache) || '';
      if (targetTask) byId('taskSelect').value = targetTask;
    }

    function addOption(select, valeur, text) {
      const option = document.createElement('option');
      option.value = valeur;
      option.textContent = text;
      select.appendChild(option);
    }

    function updateTaskDropdown() {
      const projet = byId('projectSelect').value;
      const taskSelect = byId('taskSelect');

      taskSelect.innerHTML = '';

      if (!projet) {
        addOption(taskSelect, '', t('chooseProjectFirst'));
        taskSelect.disabled = true;
        return;
      }

      addOption(taskSelect, '', t('selectTask'));

      const tasks = [...new Set(
        donneesCompletes
          .filter(ligne => ligne[0] === projet && ligne[1])
          .map(ligne => ligne[1])
      )];

      tasks.forEach(tache => addOption(taskSelect, tache, tache));
      taskSelect.disabled = !initialise;
    }

    function changerOnglet(tabId) {
      const groupName = Object.keys(TAB_GROUPS).find(name => TAB_GROUPS[name].includes(tabId));
      if (!groupName) return;

      document.querySelectorAll(`.tab[data-tab-group="${groupName}"]`).forEach(tab => {
        tab.classList.toggle('active', tab.dataset.tab === tabId);
      });

      document.querySelectorAll(`.tab-content[data-tab-group-content="${groupName}"]`).forEach(content => {
        content.classList.toggle('active', content.id === 'tab-' + tabId);
      });

      if (tabId === 'week') {
        loadWeekReport();
      }
    }

    function basculerChrono() {
      if (!initialise || sauvegardeEnCours) return;

      const projet = byId('projectSelect').value;
      const tache = byId('taskSelect').value;

      if (!projet || !tache) {
        afficherNotification(t('selectBoth'), 'warning');
        return;
      }

      if (!estEnCours) {
        demarrerChrono();
      } else {
        arreterEtEnregistrer();
      }
    }

    function demarrerChrono() {
      heureDebut = new Date();
      tempsEcouleEnPause = 0;
      estEnPause = false;
      estEnCours = true;

      clearInterval(intervalleChrono);
      intervalleChrono = setInterval(updateDisplay, 1000);
      updateDisplay();
      mettreAJourInterfaceChrono('estEnCours');
      sauvegarderEtat();
    }

    function mettreEnPauseChrono() {
      if (!initialise || sauvegardeEnCours || !estEnCours) return;

      if (!estEnPause) {
        clearInterval(intervalleChrono);
        tempsEcouleEnPause = obtenirMsEcoulees();
        estEnPause = true;
        heureDebut = null;
        byId('display').classList.remove('estEnCours');
        byId('pauseBtn').innerHTML = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
        byId('status').textContent = t('estEnPause');
        updateDisplay();
        sauvegarderEtat();
        return;
      }

      heureDebut = new Date();
      estEnPause = false;
      clearInterval(intervalleChrono);
      intervalleChrono = setInterval(updateDisplay, 1000);
      byId('display').classList.add('estEnCours');
      byId('pauseBtn').innerHTML = '<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';
      byId('status').textContent = t('timing');
      sauvegarderEtat();
    }

    function arreterEtEnregistrer() {
      if (sauvegardeEnCours) return;

      const durationMs = obtenirMsEcoulees();
      if (durationMs <= 0) {
        afficherNotification(t('invalidDuration'), 'error');
        return;
      }

      clearInterval(intervalleChrono);
      tempsEcouleEnPause = durationMs;
      estEnPause = true;
      heureDebut = null;
      updateDisplay();

      const saisie = {
        projet: byId('projectSelect').value,
        tache: byId('taskSelect').value,
        duree: durationMs / 3600000
      };

      byId('status').textContent = t('recording');
      setSavingState(true);
      showLoading('recording');

      google.script.run
        .withSuccessHandler(message => {
          hideLoading();
          effacerEtat();
          resetUI();
          setSavingState(false);
          afficherNotification(message || t('saved'), getToastTypeFromMessage(message));
          chargerHistoriqueJour();
        })
        .withFailureHandler(erreur => {
          hideLoading();
          estEnCours = true;
          estEnPause = true;
          heureDebut = null;
          clearInterval(intervalleChrono);
          mettreAJourInterfaceChrono('estEnCours');
          byId('pauseBtn').innerHTML = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
          byId('display').classList.remove('estEnCours');
          byId('status').textContent = t('saveFailed');
          setSavingState(false);
          sauvegarderEtat();
          afficherNotification(t('error') + formaterMessageErreur(erreur), 'error');
        })
        .enregistrerSaisieTemps(saisie);
    }

    function obtenirMsEcoulees() {
      if (!estEnCours) return 0;
      if (estEnPause) return tempsEcouleEnPause || 0;
      if (!heureDebut) return tempsEcouleEnPause || 0;
      return (tempsEcouleEnPause || 0) + (new Date() - heureDebut);
    }

    function updateDisplay() {
      const diff = obtenirMsEcoulees();
      const heures = String(Math.floor(diff / 3600000)).padStart(2, '0');
      const minutes = String(Math.floor((diff % 3600000) / 60000)).padStart(2, '0');
      const seconds = String(Math.floor((diff % 60000) / 1000)).padStart(2, '0');

      byId('display').textContent = `${heures}:${minutes}:${seconds}`;
    }

    function mettreAJourInterfaceChrono(etat) {
      const mainBtn = byId('mainBtn');
      const pauseBtn = byId('pauseBtn');
      const display = byId('display');

      if (etat === 'estEnCours') {
        mainBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg> ' + t('stop');
        mainBtn.className = 'btn btn-danger';
        pauseBtn.classList.remove('hidden');
        display.classList.toggle('estEnCours', !estEnPause);
        byId('status').textContent = estEnPause ? t('estEnPause') : t('timing');
        return;
      }

      mainBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg> ' + t('start');
      mainBtn.className = 'btn btn-primary';
      pauseBtn.classList.add('hidden');
      pauseBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';
      display.classList.remove('estEnCours');
    }

    function resetUI() {
      estEnCours = false;
      estEnPause = false;
      tempsEcouleEnPause = 0;
      heureDebut = null;
      clearInterval(intervalleChrono);
      intervalleChrono = null;
      byId('display').textContent = '00:00:00';
      mettreAJourInterfaceChrono('idle');
      byId('status').textContent = t('ready');
    }

    function setSavingState(isSaving) {
      sauvegardeEnCours = isSaving;

      const shouldDisable = isSaving || !initialise;
      byId('mainBtn').disabled = shouldDisable;
      byId('pauseBtn').disabled = shouldDisable;
      byId('manualSaveBtn').disabled = shouldDisable;
      byId('manualHours').disabled = shouldDisable;
      byId('btnMinus').disabled = shouldDisable;
      byId('btnPlus').disabled = shouldDisable;
      byId('projectSelect').disabled = shouldDisable;
      byId('taskSelect').disabled = shouldDisable || !byId('projectSelect').value;
    }

    function ajusterHeures(delta) {
      if (!initialise || sauvegardeEnCours) return;
      const input = byId('manualHours');
      let val = parseFloat(input.value) || 0;
      val += delta;
      val = Math.round(val * 100) / 100;

      if (val < -baseH) val = -baseH;
      if (val > baseH) val = baseH;
      if (val === 0) val = delta > 0 ? 0.25 : -0.25;

      input.value = val;
    }

    function enregistrerManuellement() {
      if (!initialise || sauvegardeEnCours) return;

      const projet = byId('projectSelect').value;
      const tache = byId('taskSelect').value;
      const heures = parseFloat(byId('manualHours').value);

      if (!projet || !tache) {
        afficherNotification(t('selectBothShort'), 'warning');
        return;
      }

      if (isNaN(heures) || heures === 0 || Math.abs(heures) > baseH) {
        afficherNotification(t('invalidDuration'), 'error');
        return;
      }

      setSavingState(true);
      byId('status').textContent = t('recording');
      showLoading('recording');

      google.script.run
        .withSuccessHandler(message => {
          hideLoading();
          afficherNotification(message || t('saved'), getToastTypeFromMessage(message));
          byId('manualHours').value = '0.5';
          byId('status').textContent = t('ready');
          setSavingState(false);
          chargerHistoriqueJour();
        })
        .withFailureHandler(erreur => {
          hideLoading();
          afficherNotification(t('error') + formaterMessageErreur(erreur), 'error');
          byId('status').textContent = t('ready');
          setSavingState(false);
        })
        .enregistrerSaisieManuelle({ projet, tache, heures });
    }

    function sauvegarderEtat() {
      const etat = {
        heureDebut: heureDebut ? heureDebut.getTime() : null,
        estEnCours,
        estEnPause,
        tempsEcouleEnPause,
        projet: byId('projectSelect').value,
        tache: byId('taskSelect').value
      };

      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(etat));
      } catch (e) { }
    }

    function chargerEtat() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY));
      } catch (e) {
        return null;
      }
    }

    function effacerEtat() {
      try {
        localStorage.removeItem(STORAGE_KEY);
      } catch (e) { }
    }

    function persistSelectionIfNeeded() {
      if (estEnCours || estEnPause) {
        sauvegarderEtat();
      }
    }

    function restoreState() {
      const etat = chargerEtat();
      if (!etat || !etat.estEnCours) return;

      estEnCours = true;
      tempsEcouleEnPause = etat.tempsEcouleEnPause || 0;
      estEnPause = Boolean(etat.estEnPause);

      if (estEnPause) {
        heureDebut = null;
        mettreAJourInterfaceChrono('estEnCours');
        byId('pauseBtn').innerHTML = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
        byId('status').textContent = t('pausedRestored');
        updateDisplay();
        return;
      }

      heureDebut = etat.heureDebut ? new Date(etat.heureDebut) : new Date();
      clearInterval(intervalleChrono);
      intervalleChrono = setInterval(updateDisplay, 1000);
      mettreAJourInterfaceChrono('estEnCours');
      updateDisplay();
    }

    function renderToday(resultat) {
      baseH = resultat.heuresDeBase || 8;
      byId('manualHours').max = baseH;
      byId('manualHours').min = -baseH;
      byId('gaugeLabel').textContent = '/ ' + baseH + 'h';
      renderHistory(resultat.saisies || []);
      mettreAJourJauge(resultat.totalHeures || 0);
    }

    function chargerHistoriqueJour() {
      showLoading('loadingData');
      
      google.script.run
        .withSuccessHandler(res => {
          hideLoading();
          renderToday(res);
        })
        .withFailureHandler(erreur => {
          hideLoading();
          afficherNotification(t('error') + formaterMessageErreur(erreur), 'error');
        })
        .obtenirSaisiesAujourdhui();
    }

    function renderHistory(saisies) {
      const container = byId('historyList');

      if (!saisies || !saisies.length) {
        container.innerHTML = '<div class="history-empty">' + t('noEntries') + '</div>';
        return;
      }

      container.innerHTML = saisies.map(saisie => `
        <div class="history-item">
          <div>
            <div class="history-proj">${esc(saisie.projet)}</div>
            <div class="history-tache">${esc(saisie.tache)}</div>
          </div>
          <div class="history-heures">${Number(saisie.heures || 0).toFixed(2)}h</div>
        </div>
      `).join('');
    }

    function mettreAJourJauge(totalHeures) {
      const max = baseH || 8;
      const pct = max > 0 ? Math.min(totalHeures / max, 1) : 0;
      const offset = CIRCUMFERENCE * (1 - pct);
      const fill = byId('gaugeFill');

      fill.style.strokeDashoffset = offset;
      fill.style.stroke = pct < 0.75 ? 'var(--success)' : pct < 0.94 ? 'var(--warning)' : 'var(--error)';
      byId('gaugeHours').textContent = Number(totalHeures || 0).toFixed(2) + 'h';
    }

    function loadWeekReport() {
      byId('weekReport').innerHTML = '<div class="history-empty">' + t('loadingData') + '</div>';
      showLoading('loadingData');

      google.script.run
        .withSuccessHandler(donnees => {
          hideLoading();
          renderWeek(donnees);
        })
        .withFailureHandler(erreur => {
          hideLoading();
          byId('weekReport').innerHTML = '<div class="history-empty">' + t('error') + '</div>';
          afficherNotification(t('error') + formaterMessageErreur(erreur), 'error');
        })
        .obtenirRapportHebdomadaire(lang);
    }

    function renderWeek(donnees) {
      const container = byId('weekReport');

      if (!donnees || !donnees.jours) {
        container.innerHTML = '<div class="history-empty">' + t('noData') + '</div>';
        return;
      }

      let html = '';
      let totalBase = 0;

      donnees.jours.forEach(info => {
        const day = info.dayLabel;
        const heuresDeBase = Number(info.heuresDeBase || 0);
        const total = Number(info.total || 0);
        totalBase += heuresDeBase;

        const pct = heuresDeBase > 0 ? Math.round((total / heuresDeBase) * 100) : 0;
        const color = pct >= 100 ? 'var(--success)' : pct >= 75 ? 'var(--warning)' : 'var(--outline)';

        html += `
          <div class="week-day">
            <div class="week-day-header">
              <span>${esc(day)} <span style="font-weight:400;font-size:10px;color:var(--outline)">(${heuresDeBase}h)</span></span>
              <span class="week-day-total" style="color:${color}">${total.toFixed(2)}h</span>
            </div>
        `;

        if (info.saisies && info.saisies.length) {
          info.saisies.forEach(saisie => {
            html += `<div class="week-saisie">${esc(saisie.projet)} - ${esc(saisie.tache)} : ${Number(saisie.heures || 0).toFixed(2)}h</div>`;
          });
        }

        html += '</div>';
      });

      const avgBase = totalBase > 0 ? totalBase : 40;
      const equivalentJours = avgBase > 0 ? (donnees.totalSemaine / avgBase * 5).toFixed(2) : '0.00';

      html += `<div class="week-resume">${t('totalWeek')} : ${Number(donnees.totalSemaine || 0).toFixed(2)}h / ${totalBase}h (${equivalentJours} ${t('jours')})</div>`;
      container.innerHTML = html;
    }

    let toastTimer = null;

    function afficherNotification(message, type = 'success') {
      const toast = byId('toast');
      const icon = byId('toastIcon');

      if (toastTimer) clearTimeout(toastTimer);

      toast.className = 'toast toast-' + type;
      if (type === 'success') {
        icon.innerHTML = '<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-6.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>';
      } else if (type === 'error') {
        icon.innerHTML = '<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-6.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>';
      } else {
        icon.innerHTML = '<path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/>';
      }
      byId('toastMsg').textContent = message;

      toast.classList.add('show');
      toastTimer = setTimeout(() => toast.classList.remove('show'), 3500);
    }

    function getToastTypeFromMessage(message) {
      if (!message) return 'success';
      if (message.startsWith('⚠️') || message.startsWith('⚠')) return 'warning';
      if (message.startsWith('❌') || message.startsWith('⛔')) return 'error';
      return 'success';
    }

    function formaterMessageErreur(erreur) {
      const message = erreur && erreur.message ? erreur.message : '';
      return message ? ' : ' + message : '';
    }

    function esc(valeur) {
      const div = document.createElement('div');
      div.textContent = valeur == null ? '' : String(valeur);
      return div.innerHTML;
    }

    document.addEventListener('keydown', event => {
      const tag = event.target && event.target.tagName ? event.target.tagName : '';
      if (tag === 'INPUT' || tag === 'SELECT' || sauvegardeEnCours || !initialise) return;

      if (event.code === 'Space') {
        event.preventDefault();
        basculerChrono();
      }

      if (event.code === 'KeyP') {
        event.preventDefault();
        mettreEnPauseChrono();
      }
    });

    function rafraichirProjets() {
      if (!initialise || sauvegardeEnCours) return;

      byId('btnRefresh').disabled = true;
      afficherNotification(t('refreshing'), 'success');
      showLoading('refreshing');

      google.script.run
        .withSuccessHandler(donnees => {
          hideLoading();
          donneesCompletes = donnees || [];
          renderProjects(donneesCompletes);
          byId('btnRefresh').disabled = false;
          afficherNotification(t('refreshed'), 'success');
        })
        .withFailureHandler(erreur => {
          hideLoading();
          byId('btnRefresh').disabled = false;
          afficherNotification(t('error') + formaterMessageErreur(erreur), 'error');
        })
        .obtenirProjetsEtTaches();
    }

    // ============ AIDE ============
    let helpStep = 0;

    function obtenirEtapesAide() {
      return [
        {
          icon: '<svg viewBox="0 0 24 24"><path d="M10 10.02h5V21h-5V10.02zM17 21h3c1.1 0 2-.9 2-2v-9h-5v11zm5-13V5c0-1.1-.9-2-2-2h-3v5h5zM10 3h5v5h-5V3zM3 5v3h5V3H4c-1.1 0-2 .9-2 2zm0 14c0 1.1.9 2 2 2h3V10H2v9h1z"/></svg>',
          title: t('helpStep1Title'),
          html: t('helpStep1')
        },
        {
          icon: '<svg viewBox="0 0 24 24"><path d="M22 7h-9v2h9V7zm0 4h-9v2h9v-2zM4.3 7.6L2.9 9l3.5 3.5 6.4-6.4-1.4-1.4-5 5-2.1-2.1zm0 5L2.9 14l3.5 3.5 6.4-6.4-1.4-1.4-5 5-2.1-2.1zM22 15h-9v2h9v-2z"/></svg>',
          title: t('helpStep2Title'),
          html: t('helpStep2')
        },
        {
          icon: '<svg viewBox="0 0 24 24"><path d="M15 1H9v2h6V1zm-4 13h2V8h-2v6zm8.03-6.61l1.42-1.42c-.43-.51-.9-.99-1.41-1.41l-1.42 1.42C16.07 4.74 14.12 4 12 4c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-2.12-.74-4.07-1.97-5.61zM12 20c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/></svg>',
          title: t('helpStep3Title'),
          html: `${t('helpStep3Chrono')}<br><br>${t('helpStep3Manual')}`
        },
        {
          icon: '<svg viewBox="0 0 24 24"><path d="M5 9.2h3V19H5zM10.6 5h2.8v14h-2.8zm5.6 8H19v6h-2.8z"/></svg>',
          title: t('helpStep4Title'),
          html: t('helpStep4')
        }
      ];
    }

    function ouvrirAide() {
      helpStep = 0;
      const etapes = obtenirEtapesAide();
      const stepsContainer = byId('helpSteps');
      const dotsContainer = byId('helpDots');

      byId('helpTitle').textContent = t('helpTitle');

      stepsContainer.innerHTML = etapes.map((etape, i) => `
        <div class="help-step${i === 0 ? ' active' : ''}" id="helpStep${i}">
          <div class="help-step-icon">
            ${etape.icon}
          </div>
          <h3>${etape.title}</h3>
          <p style="text-align:left">${etape.html}</p>
        </div>
      `).join('');

      dotsContainer.innerHTML = etapes.map((_, i) =>
        `<div class="help-dot${i === 0 ? ' active' : ''}" id="helpDot${i}"></div>`
      ).join('');

      mettreAJourBoutonsAide(etapes.length);
      byId('helpOverlay').classList.add('open');
    }

    function fermerAide(event) {
      if (event && event.target !== byId('helpOverlay')) return;
      byId('helpOverlay').classList.remove('open');
    }

    function naviguerAide(direction) {
      const etapes = obtenirEtapesAide();
      if (direction === 1 && helpStep === etapes.length - 1) {
        byId('helpOverlay').classList.remove('open');
        return;
      }

      byId('helpStep' + helpStep).classList.remove('active');
      byId('helpDot' + helpStep).classList.remove('active');

      helpStep = Math.max(0, Math.min(helpStep + direction, etapes.length - 1));

      byId('helpStep' + helpStep).classList.add('active');
      byId('helpDot' + helpStep).classList.add('active');
      mettreAJourBoutonsAide(etapes.length);
    }

    function mettreAJourBoutonsAide(total) {
      const prev = byId('helpPrevBtn');
      const next = byId('helpNextBtn');
      prev.textContent = t('helpPrev');
      prev.style.visibility = helpStep === 0 ? 'hidden' : 'visible';
      next.textContent = helpStep === total - 1 ? t('helpClose') : t('helpNext');
    }

    function changerLangue(nouvelleLangue) {
      if (lang === nouvelleLangue) return;
      lang = nouvelleLangue;
      
      localStorage.setItem('timetracker_lang', lang);
      
      byId('lang-fr').classList.toggle('active', lang === 'fr');
      byId('lang-en').classList.toggle('active', lang === 'en');
      
      applyI18n();
      
      renderProjects(donneesCompletes);
      
      if (byId('tab-week').classList.contains('active')) {
        loadWeekReport();
      }
      
      byId('gaugeLabel').textContent = '/ ' + baseH + 'h';
      
      if (!estEnCours) {
        byId('status').textContent = t('ready');
      } else if (estEnPause) {
        byId('status').textContent = t('estEnPause');
      } else {
        byId('status').textContent = t('timing');
      }
      
      mettreAJourInterfaceChrono(estEnCours ? 'estEnCours' : 'idle');
    }

    return {
      init,
      basculerChrono,
      mettreEnPauseChrono,
      enregistrerManuellement,
      ajusterHeures,
      changerOnglet,
      rafraichirProjets,
      ouvrirAide,
      fermerAide,
      naviguerAide,
      changerLangue
    };
  })();

  window.onload = App.init;
</script>
